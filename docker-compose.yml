name: cyberscan

x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-compose-development-only}
  DEBUG: ${DEBUG:-False}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],backend,testserver}
  CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-False}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
  JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
  JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
  POSTGRES_DB: ${POSTGRES_DB:-cyberapp_db}
  POSTGRES_USER: ${POSTGRES_USER:-cyberscan}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberscan_dev_password}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_WORKER_POOL: ${CELERY_WORKER_POOL:-solo}
  CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
  CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-1800}
  CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-1740}
  CYBERSCAN_SITE_URL: ${CYBERSCAN_SITE_URL:-http://localhost:4200}
  CYBERSCAN_API_URL: ${CYBERSCAN_API_URL:-http://localhost:8000}
  CYBERSCAN_HISTORY_URL: ${CYBERSCAN_HISTORY_URL:-http://localhost:4200/historique}
  REPORT_EMAIL_LINK_MAX_AGE: ${REPORT_EMAIL_LINK_MAX_AGE:-604800}
  EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-CyberScan <noreply@localhost>}
  EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-20}
  SCANNER_COMMAND_TIMEOUT: ${SCANNER_COMMAND_TIMEOUT:-60}
  NVD_API_KEY: ${NVD_API_KEY:-}
  IP_METADATA_LOOKUP_ENABLED: ${IP_METADATA_LOOKUP_ENABLED:-True}
  IP_METADATA_URL: ${IP_METADATA_URL:-https://ipwho.is/{ip}}
  IP_METADATA_TIMEOUT: ${IP_METADATA_TIMEOUT:-8}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberapp_db}
      POSTGRES_USER: ${POSTGRES_USER:-cyberscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberscan_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: cyberscan-backend
    build:
      context: ./backend
    environment:
      <<: *backend-environment
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@cyberscan.local}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
    command:
      - /bin/sh
      - -c
      - python manage.py migrate --noinput && python manage.py ensure_admin && python manage.py collectstatic --noinput && exec gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 1800 --access-logfile - --error-logfile -
    ports:
      - ${BACKEND_PORT:-8000}:8000
    volumes:
      - ./backend/media:/app/media
      - django_static:/app/staticfiles
      - huggingface_cache:/home/cyberscan/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, /app/healthcheck.py]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    init: true
    restart: unless-stopped

  worker:
    image: cyberscan-backend
    environment: *backend-environment
    command: [celery, -A, backend, worker, --loglevel=INFO]
    volumes:
      - ./backend/media:/app/media
      - huggingface_cache:/home/cyberscan/.cache/huggingface
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - ${DOCKER_GID:-0}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - ${FRONTEND_PORT:-4200}:80
    volumes:
      - ./backend/media:/var/www/media:ro
      - django_static:/var/www/static:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:lts
    ports:
      - ${PORTAINER_HTTPS_PORT:-9443}:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  django_static:
  huggingface_cache:
  portainer_data:
