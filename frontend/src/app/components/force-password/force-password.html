<div class="force-container">
  <div class="force-card">
    <h1>[ CHANGEMENT DE MOT DE PASSE REQUIS ]</h1>
    <p class="subtitle">
      Pour des raisons de sécurité, vous devez changer votre mot de passe temporaire avant de continuer.
    </p>

    <p *ngIf="error" class="error">{{ error }}</p>

    <label>Mot de passe temporaire (reçu par email)</label>
    <input type="password" [(ngModel)]="oldPassword" />

    <label>Nouveau mot de passe</label>
    <input type="password" [(ngModel)]="newPassword" />

    <label>Confirmer nouveau mot de passe</label>
    <input type="password" [(ngModel)]="confirmPassword" />

    <button class="btn-primary" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Validation...' : '▶ Valider et continuer' }}
    </button>

    <button class="btn-link" (click)="logout()">Se déconnecter</button>
  </div>
</div>
