<div class="vuln-modal-overlay" (click)="cancel()">
  <div class="vuln-modal-box" (click)="$event.stopPropagation()">
    <div class="vuln-modal-header">
      <span>[ AJOUTER UNE VULNÉRABILITÉ ]</span>
      <button class="close-btn" (click)="cancel()">✕</button>
    </div>

    <div class="vuln-modal-body">
      <p *ngIf="error" class="error">{{ error }}</p>

      <label>Type de vulnérabilité</label>
      <select [(ngModel)]="form.type_vuln" (change)="onTypeChange()">
        <option *ngFor="let t of types" [value]="t.value">{{ t.label }}</option>
      </select>

      <label>Nom de la vulnérabilité</label>
      <input type="text" [(ngModel)]="form.nom" placeholder="Ex: Peut voir l'historique des autres demandes" />

      <label>Élément impacté (URL)</label>
      <input type="text" [(ngModel)]="form.impacted_element" placeholder="https://exemple.com/api/requests/123" />

      <div class="row">
        <div class="col">
          <label>Niveau de risque</label>
          <select [(ngModel)]="form.risk">
            <option *ngFor="let r of risks" [value]="r.value">{{ r.label }}</option>
          </select>
        </div>
        <div class="col">
          <label>Score CVSS</label>
          <input type="number" step="0.1" min="0" max="10" [(ngModel)]="form.cvss_score" />
        </div>
      </div>

      <label>Vecteur CVSS (optionnel)</label>
      <input type="text" [(ngModel)]="form.cvss_vector" placeholder="CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:L/A:N" />

      <div class="row">
        <div class="col">
          <label>Priorité</label>
          <input type="text" [(ngModel)]="form.priorite" placeholder="Important" />
        </div>
        <div class="col">
          <label>Complexité</label>
          <input type="text" [(ngModel)]="form.complexite" placeholder="Faible" />
        </div>
      </div>

      <label>Description</label>
      <textarea rows="3" [(ngModel)]="form.description"></textarea>

      <label>Risques techniques et business</label>
      <textarea rows="3" [(ngModel)]="form.technical_business_risks"></textarea>

      <label>Recommandation</label>
      <textarea rows="3" [(ngModel)]="form.recommandation"></textarea>

      <label>Preuve de concept (optionnel)</label>
      <textarea rows="3" [(ngModel)]="form.proof_of_concept" placeholder="Request/Response, captures..."></textarea>

      <label>Références (optionnel)</label>
      <textarea rows="2" [(ngModel)]="form.references" placeholder="https://owasp.org/..."></textarea>

      <div class="modal-actions">
        <button class="btn-secondary" (click)="cancel()">Annuler</button>
        <button class="btn-primary" (click)="submit()" [disabled]="loading">
          {{ loading ? 'Enregistrement...' : '▶ Enregistrer' }}
        </button>
      </div>
    </div>
  </div>
</div>
